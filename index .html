<script src="firebase-config.js"></script><script>

function geom(c){

/* sound */
let AC;
function snd(f,d=.1,ty='sine',v=.15,w=0){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sMove=()=>{snd(520,.09);snd(780,.07,'sine',.1,.06)},sWall=()=>snd(140,.16,'square',.12),sErr=()=>snd(110,.2,'sawtooth',.1),sWin=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.28,'triangle',.15,i*.13));
/* rules */
function fresh(){return{p:ST.map(x=>[...x]),w:Array(NP).fill(cfg.walls),h:{},v:{},t:0,n:0,lose:-1,clk:Array(NP).fill(cfg.time*1000),c:{...cfg}}}
function blocked(s,r1,c1,r2,c2){
  if(c1===c2){const r=Math.min(r1,r2);return !!(s.h[r+','+c1]||s.h[r+','+(c1-1)])}
  const c=Math.min(c1,c2);return !!(s.v[r1+','+c]||s.v[(r1-1)+','+c]);
}
const occ=(s,r,c,i)=>s.p.some((q,j)=>j!==i&&q[0]===r&&q[1]===c);
const reached=(s,i)=>{const[a,v]=G[i];return a==='m'?(s.p[i][0]===4&&s.p[i][1]===4):s.p[i][a==='r'?0:1]===v};
const winner=()=>S.lose>=0?(NP===2?1-S.lose:-1):S.p.findIndex((_,i)=>reached(S,i));
function moves(s,i){
  const[r,c]=s.p[i],out=[];
  for(const[dr,dc]of D){
    const nr=r+dr,nc=c+dc;
    if(!inb(nr,nc)||blocked(s,r,c,nr,nc))continue;
    if(occ(s,nr,nc,i)){
      const jr=nr+dr,jc=nc+dc;
      if(inb(jr,jc)&&!blocked(s,nr,nc,jr,jc)&&!occ(s,jr,jc,i))out.push([jr,jc]);

        if(er*dr+ec*dc!==0)continue;

}
function dist(s,i){
  const[ax,gv]=G[i],seen=new Uint8Array(ROWS*9);let q=[s.p[i]],d=0;

    const nx=[];
    for(const[r,c]of q){

      for(const[dr,dc]of D){
        const a=r+dr,b=c+dc;

function place(s,t,r,c,i){const n={...s,h:{...s.h},v:{...s.v},w:[...s.w]};n[t][r+','+c]=i+1;n.w[i]--;return n}

  if(r<0||r>ROWS-2||c<0||c>7||s.w[i]<1)return false;
  const k=r+','+c;
  if(t==='h'){if(s.h[k]||s.h[r+','+(c-1)]||s.h[r+','+(c+1)]||s.v[k])return false}
  else{if(s.v[k]||s.v[(r-1)+','+c]||s.v[(r+1)+','+c]||s.h[k])return false}
  const n=place(s,t,r,c,i);
  for(let j=0;j<s.p.length;j++)if(dist(n,j)<0)return false;
  return true;
}
const apply=(s,i,a)=>a.m?{...s,p:s.p.map((x,j)=>j===i?a.m:x)}:place(s,a.w[0],a.w[1],a.w[2],i);
function cands(s,i){
  const a=moves(s,i).map(m=>({m}));
  if(s.w[i]>0)for(let r=0;r<ROWS-1;r++)for(let c=0;c<8;c++)for(const t of['h','v'])if(wallOK(s,t,r,c,i))a.push({w:[t,r,c]});

}
function ev(s,me){

  for(let j=0;j<s.p.length;j++)if(j!==me){d+=dist(s,j);w+=s.w[j];k++}

function aiPick(s,me){

    const n=apply(s,me,a);

const live=()=>cfg.kind!=='online'||started;
const canAct=()=>winner()<0&&live()&&(cfg.kind==='online'?S.t===seat:(cfg.kind==='local'||S.t===0));
const viewer=()=>cfg.kind==='online'?Math.max(seat,0):cfg.kind==='ai'?0:S.t;
const nm=i=>cfg.kind==='online'?(i===seat?'You':'P'+(i+1)):cfg.kind==='ai'?(i===0?'You':'AI'+(NP>2?i:'')):'P'+(i+1);
function send(){if(cfg.kind==='online'&&grp)grp.emit('state',{s:S})}
function act(a){
  const me=S.t;
  S=apply(S,me,a);S.n++;

function endNow(who){S.lose=who;S.n++;send();setTimeout(sWin,150);render()}
const fmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};
function left(i,now){

  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.pawn').forEach(g=>{const[r,c]=S.p[+g.dataset.i];g.style.transform=`translate(${c*48}px,${r*48}px)`})));
  prevP=S.p.map(x=>[...x]);
  const bg=['#c8283e,#a81d33','#2b4a9a,#1f3a80','#1b8f57,#157044','#e08e0b,#b87208'];
  $('bar').innerHTML=S.p.map((_,i)=>`<div class="pl${w<0&&S.t===i?' act':''}" style="background:linear-gradient(${bg[i]})"><span><span>${nm(i)}</span><small>🧱 ${S.w[i]}</small></span>${NP===2?`<span class="tm" id="tm${i}">∞</span>`:''}</div>`).join('<span class="vs">VS</span>');
  $('fin').textContent=cfg.mode==='race'?'🏁 FINISH':cfg.mode==='four'?'🎯 REACH THE CENTRE':'';
  $('foot').textContent=cfg.mode==='race'?'▲ '+S.p.map((_,i)=>nm(i).toUpperCase()).join(' · '):'';
  $('st').textContent=info&&!live()?info:w>=0?(nm(w)==='You'?'🏆 You win!':'🏆 '+nm(w)+' wins!'):cfg.kind==='online'?(S.t===seat?'Your turn':nm(S.t)+"'s turn"):cfg.kind==='ai'?(S.t===0?'Your turn':nm(S.t)+' is thinking…'):nm(S.t)+"'s turn";
  const v=viewer();
  $('tray').innerHTML=`<b style="font-size:18px">🧱 ${S.w[v]}</b><div class="wp" data-t="h"><i class="wh"></i></div><div class="wp" data-t="v"><i class="wv"></i></div>`;
  tick();
}
/* input: tap move */
$('wrap').addEventListener('click',e=>{
  const x=e.target;if(!canAct()||busy||!x.classList.contains('mv'))return;
  act({m:[+x.dataset.r,+x.dataset.c]});
});
/* input: drag wall */
function dragAnchor(e){
  const svg=$('bd');if(!svg)return null;
  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  const q=p.matrixTransform(svg.getScreenCTM().inverse()),y=q.y-(e.pointerType==='touch'?36:0),x=q.x,H=ROWS*48-8;
  if(x<-20||x>444||y<-20||y>H+20)return null;
  const cl=(v,m)=>Math.max(0,Math.min(m,v));
  return[drag.t,cl(Math.round((y-44)/48),ROWS-2),cl(Math.round((x-44)/48),7)];
}
function ghost(a){
  const g=$('gh');if(!g)return;
  if(!a){g.setAttribute('opacity',0);return}
  const[t,r,c]=a;
  g.setAttribute('x',t==='h'?c*48:c*48+40);g.setAttribute('y',t==='h'?r*48+40:r*48);
  g.setAttribute('width',t==='h'?88:8);g.setAttribute('height',t==='h'?8:88);
  g.setAttribute('fill',wallOK(S,t,r,c,S.t)?'var(--hl)':'#ff4d4d');g.setAttribute('opacity',.8);
}
document.addEventListener('pointerdown',e=>{
  const p=e.target.closest&&e.target.closest('.wp');
  if(!p||!canAct()||busy||S.w[S.t]<1)return;
  drag={t:p.dataset.t};e.preventDefault();ghost(dragAnchor(e));
});
document.addEventListener('pointermove',e=>{if(drag){e.preventDefault();ghost(dragAnchor(e))}},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!drag)return;const a=dragAnchor(e);ghost(null);
  if(a){if(wallOK(S,a[0],a[1],a[2],S.t))act({w:a});else sErr()}
  drag=null;
});
/* reactions */
function floatEmo(e){const d=document.createElement('div');d.className='fl';d.textContent=e;d.style.left=(20+Math.random()*60)+'%';d.style.top='55%';$('bdw').appendChild(d);setTimeout(()=>d.remove(),1400)}
document.querySelectorAll('.emo button').forEach(b=>b.onclick=()=>{floatEmo(b.textContent);if(grp)grp.emit('emo',{e:b.textContent})});
$('sd').onclick=()=>{mute=!mute;$('sd').textContent=mute?'🔇':'🔊'};
/* online transport */
function fbGroup(code){
  const id=Math.random().toString(36).slice(2,10),base=`${FIREBASE_URL}/rooms/${code}/msgs`,hs={},es=new EventSource(base+'.json');
  es.addEventListener('put',ev=>{const d=JSON.parse(ev.data);if(d.path==='/'||!d.data)return;const m=d.data;(hs[m.topic]||[]).forEach(f=>f({topic:m.topic,data:m.data,sameTab:m.from===id}))});
  return{on:(t,f)=>{(hs[t]=hs[t]||[]).push(f)},emit:(t,data)=>fetch(base+'.json',{method:'POST',body:JSON.stringify({topic:t,data,from:id,ts:Date.now()})}),leave:async()=>es.close()};
}
async function connect(code){
  try{
    if(FIREBASE_URL)grp=fbGroup(code);
    else{if(typeof claude==='undefined')throw 0;const R=await claude.use('room');if(!R)throw 0;grp=await R.join('wr-'+code)}
    grp.on('emo',m=>{if(!m.sameTab&&m.data)floatEmo(m.data.e)});return true;
  }catch(e){$('hm').textContent='Online is not available here (needs a Firebase URL, or the claude.ai viewer).';info='';showHome();return false}
}
async function leave(){clearInterval(tmr);if(grp){try{await grp.leave()}catch(e){}}grp=null;started=false;seat=-1;isHost=false;info=''}
function showGame(){$('waiting-room').hidden=true;$('home').hidden=true;$('game').hidden=false;$('modal').hidden=true;render()}
async function showHome(){await leave();$('waiting-room').hidden=true;$('game').hidden=true;$('home').hidden=false;$('modal').hidden=true}
$('hb').onclick=showHome;
$('rs').onclick=()=>{
  if(!S||winner()>=0||NP!==2)return showHome();
  endNow(cfg.kind==='online'?seat:cfg.kind==='ai'?0:S.t);
};
async function startLocal(){await leave();geom(cfg);S=fresh();prevP=null;lastWall='';turnStart=Date.now();showGame()}
async function createRoom(){
  await leave();geom(cfg);S=fresh();prevP=null;lastWall='';
  const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  isHost=true;seat=0;started=false;
  if(!await connect(code))return;
  const seatBy={};let next=1;
  grp.on('hi',m=>{
    if(m.sameTab||!isHost)return;const n=m.data&&m.data.nonce;if(!n)return;
    if(seatBy[n]===undefined){if(next>=NP)return;seatBy[n]=next++}
    grp.emit('seat',{nonce:n,seat:seatBy[n],cfg});
    if(next>=NP&&!started){started=true;turnStart=Date.now();sMove()}
    if(started)grp.emit('state',{s:S});
    info=`Room ${code}: ${next}/${NP} players`;
    if(started){showGame()}else{$('waiting-title').textContent=`Waiting for players... (${next}/${NP})`}
  });
  
info = `Room ${code} — share this code. Waiting 1/${NP}…`;
$('waiting-code').textContent = code;
$('waiting-title').textContent = `Waiting for players... (1/${NP})`;
$('home').hidden = true;
$('game').hidden = true;
$('modal').hidden = true;
$('waiting-room').hidden = false;

}

$('invite-friend').onclick = async () => {
  const code = $('waiting-code').textContent.trim();
  const url = new URL(window.location.href);
  url.searchParams.set('room', code);

  try {
    if (navigator.share) {
      await navigator.share({
        title: 'WallRush India',
        text: 'Join my WallRush India room!',
        url: url.href
      });
    } else {
      await navigator.clipboard.writeText(url.href);
      alert('Invite link copied! Send it to your friend.');
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      prompt('Copy this invite link:', url.href);
    }
  }
};

$('cancel-waiting').onclick = async () => {
  $('waiting-room').hidden = true;
  await showHome();
};

$('jn').onclick=async()=>{
  const code=$('code').value.trim().toUpperCase();if(code.length!==4)return;
  await leave();cfg.kind='online';nonce=Math.random().toString(36).slice(2,10);isHost=false;
  if(!await connect(code))return;
  geom(cfg);S=fresh();prevP=null;
  grp.on('seat',m=>{const d=m.data;if(!d||d.nonce!==nonce||seat>=0)return;seat=d.seat;cfg={...d.cfg,kind:'online'};geom(cfg);S=fresh();info='Joined as P'+(seat+1)+'. Waiting for host…';render()});
  grp.on('state',m=>{
    if(m.sameTab||!m.data||!m.data.s||seat<0)return;const d=m.data.s;
    if(started&&d.n<=S.n)return;
    S=d;started=true;lastWall='';turnStart=Date.now();
    if(winner()>=0)setTimeout(sWin,150);else sMove();render();
  });
  info='Connecting to room '+code+'…';showGame();
  const ping=()=>{if(seat>=0)return clearInterval(tmr);grp&&grp.emit('hi',{nonce})};
  ping();tmr=setInterval(ping,2000);
};
/* setup modal */
let dr;
function norm(){
  if(dr.mode==='four'){dr.walls=5;dr.time=0}else if(dr.mode==='duel')dr.walls=10;else if(![10,15].includes(dr.walls))dr.walls=15;
}
const MD={duel:'Duel: start on opposite sides, reach the other side.',race:'New mode: both players start on the same side and race to the finish at the top. Bigger board, 15 walls each. First to arrive wins!',four:'4 players: one on each edge, first to reach the centre wins. 5 walls each.'};
function setup(kind){dr={...cfg,kind};norm();draw();$('modal').hidden=false}
function draw(){
  const ch=(key,opts)=>`<div class="ch">${opts.map(([v,l])=>`<button class="${dr[key]===v?'on':''}" data-k="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  let h=`<h2>${dr.kind==='online'?'Create room':'New game'}</h2>`;
  if(dr.kind==='ai')h+=`<div class="k">LEVEL</div>`+ch('lv',[[0,'Easy'],[1,'Normal'],[2,'Hard']]);
  h+=`<div class="k">MODE</div>`+ch('mode',[['duel','⚔️ Duel'],['race','🏁 Race'],['four','👥 4 players']])+`<p>${MD[dr.mode]}</p><div class="k">WALLS</div>`;
  h+=ch('walls',dr.mode==='race'?[[10,'10 🧱'],[15,'15 🧱']]:[[dr.walls,dr.walls+' 🧱']]);
  if(dr.mode!=='four')h+=`<div class="k">TIME</div>`+ch('time',[[0,'∞ No time'],[180,'3 min'],[300,'5 min']])+`<p>${dr.time?'Each player has this much total time.':'No time: miss a move for 30s and you lose (online).'}</p>`;
  h+=`<br><button class="pri" id="go" style="width:100%">${dr.kind==='online'?'Create room':'Start'}</button><button id="cx" style="width:100%;margin-top:8px;border:0;color:var(--hl)">Cancel</button>`;
  $('mc').innerHTML=h;
}
$('mc').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='cx')return $('modal').hidden=true;
  if(b.id==='go'){cfg={...dr};return cfg.kind==='online'?createRoom():startLocal()}
  if(b.dataset.k){const v=b.dataset.v;dr[b.dataset.k]=isNaN(+v)?v:+v;if(b.dataset.k==='mode'&&v==='race')dr.walls=15;norm();draw()}
});
$('h-ai').onclick=()=>setup('ai');$('h-lo').onclick=()=>setup('local');$('h-on').onclick=()=>setup('online');
/* invite link: ?room=CODE joins automatically */
const qr=new URLSearchParams(location.search).get('room');
if(qr&&/^[A-Za-z]{4}$/.test(qr)){$('code').value=qr.toUpperCase();$('jn').onclick()}
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body></html>
